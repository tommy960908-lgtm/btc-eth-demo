<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>交易所模擬器</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e6eaf3;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:18px 16px;background:#151c30;border-bottom:1px solid #29334b}h1{font-size:19px;margin:0 0 5px}.muted{color:#96a3bd;font-size:12px}.wrap{max-width:1050px;margin:auto;padding:14px;display:grid;gap:12px}.card{background:#151c30;border:1px solid #29334b;border-radius:14px;padding:15px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big{font-size:22px;font-weight:750;margin-top:6px}.green{color:#32d399}.red{color:#ff657a}label{display:block;color:#aab6cd;font-size:12px;margin:12px 0 6px}input,select,button{font:inherit;border-radius:9px;padding:11px 12px}input,select{width:100%;background:#0c1427;color:white;border:1px solid #35415c}button{border:0;background:#35415c;color:white;font-weight:650;cursor:pointer}button.active{background:#4060ac}.btns{display:flex;gap:8px}.btns>*{flex:1}.buy{background:#087e64}.sell{background:#aa3852}.danger{background:#81374b}.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}canvas{width:100%;height:300px;display:block}.timeframes{display:flex;gap:5px;overflow-x:auto;margin:12px 0 4px}.timeframes button{padding:7px 11px;white-space:nowrap;background:#252e41;color:#aab6cd}.timeframes button.active{background:#4a3920;color:#ffba4a}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 8px;text-align:left;border-bottom:1px solid #29334b}th{color:#9ca9c2;font-size:12px}.pill{display:inline-block;border:1px solid #35415c;border-radius:30px;padding:5px 9px}.notice{padding:10px;background:#302c1b;border-radius:8px;color:#f4d889;font-size:12px;line-height:1.6}#toast{min-height:18px;color:#f4d889;margin-top:10px}@media(max-width:750px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}canvas{height:270px}}.price-field{display:flex;align-items:stretch;gap:0}.price-field input{min-width:0;flex:1;border-radius:9px 0 0 9px}.price-field button{border:1px solid #35415c;border-left:0;border-radius:0 9px 9px 0;color:#f4a928;background:#252e41;padding:10px 16px;white-space:nowrap}.price-field button:disabled{opacity:.4;cursor:not-allowed} </style></head><body><header><div style="max-width:1050px;margin:auto"><h1>📈 BTC / ETH 交易所模擬器</h1></div></header><main class="wrap"><section class="stats"><div class="card"><div class="muted">帳戶權益 USDT</div><div class="big" id="equity">—</div></div><div class="card"><div class="muted">可用餘額 USDT</div><div class="big" id="balance">—</div></div><div class="card"><div class="muted">未實現損益 USDT</div><div class="big" id="unreal">—</div></div><div class="card"><div class="muted">已實現損益 USDT</div><div class="big" id="realized">—</div></div></section><section class="cols"><div class="card"><div class="btns"><button id="btc" class="active" onclick="switchSymbol('BTC')">BTC / USDT</button><button id="eth" onclick="switchSymbol('ETH')">ETH / USDT</button></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px"><div><div class="muted">真實市場最新價</div><div class="big" id="price">—</div></div><span class="pill" id="feedStatus">行情連線中…</span></div><div class="timeframes" id="timeframes"><button onclick="setIntervalK('1m')">1m</button><button onclick="setIntervalK('5m')">5m</button><button onclick="setIntervalK('15m')">15m</button><button onclick="setIntervalK('1h')">1h</button><button onclick="setIntervalK('4h')">4h</button><button onclick="setIntervalK('1d')">1D</button></div><canvas id="chart"></canvas></div><div class="card"><h3 style="margin:0">建立模擬倉位</h3><label>方向</label><div class="btns"><button id="long" class="buy" onclick="setSide('long')">做多 LONG ✓</button><button id="short" onclick="setSide('short')">做空 SHORT</button></div><label>訂單類型</label><select id="orderType" onchange="toggleOrderType()"><option value="limit">限價單</option><option value="market">市價單</option></select><label>訂單價格 (USDT)</label><div class="price-field"><input id="orderPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入限價或點選最新" oninput="updateEstimate()"><button type="button" id="latestBtn" onclick="useLatestPrice()">最新</button></div><label>按數量訂購（<span id="quantityUnit">BTC</span>）</label><input id="quantity" type="number" min="0" step="any" inputmode="decimal" placeholder="例如 0.001" oninput="updateEstimate()"><div class="muted" id="estimate" style="margin-top:8px">預估訂單價值：— USDT</div><label>止盈觸發價格（USDT）</label><input id="tp" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入幣價，例如 62000"><label>止損觸發價格（USDT）</label><input id="sl" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入幣價，例如 60500"><button style="width:100%;background:#4060ac" onclick="openTrade()">送出模擬訂單</button><div id="toast"></div></div></section><section class="card"><h3>目前委託單</h3><div class="tablewrap"><table><thead><tr><th>幣種／方向</th><th>限價</th><th>數量</th><th>操作</th></tr></thead><tbody id="pending"></tbody></table></div></section><section class="card"><h3>目前持倉</h3><div class="tablewrap"><table><thead><tr><th>交易對 / 方向</th><th>進場價</th><th>幣種數量</th><th>訂單價值</th><th>浮動損益</th><th>止盈 / 止損觸發價</th><th>操作</th></tr></thead><tbody id="positions"></tbody></table></div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>歷史交易紀錄</h3><button onclick="resetAccount()">重設練習帳戶</button></div><div class="tablewrap"><table><thead><tr><th>時間</th><th>交易對</th><th>方向</th><th>平倉原因</th><th>損益 USDT</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script>
const KEY='mcf_demo_btc_eth_live_v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!state.prices){state={balance:100000,realized:0,prices:{BTC:95000,ETH:3200},positions:[],history:[],pending:[]}}state.pending ||= [];for(const p of state.positions||[]){if(!p.triggerPriceMode){const gain=p.tp,loss=p.sl;p.tp=p.entry+(p.side==='long'?1:-1)*gain/p.qty;p.sl=p.entry-(p.side==='long'?1:-1)*loss/p.qty;p.triggerPriceMode=true}}for(const o of state.pending){if(!o.triggerPriceMode){const ref=o.limit,margin=o.qty*ref,gain=o.tpMode==='pct'?margin*o.tp/100:o.tp,loss=o.slMode==='pct'?margin*o.sl/100:o.sl;o.tp=ref+(o.side==='long'?1:-1)*gain/o.qty;o.sl=ref-(o.side==='long'?1:-1)*loss/o.qty;o.triggerPriceMode=true}}for(const p of state.positions||[]){if(p.lev!==1){p.lev=1;p.qty=p.margin/p.entry}}let symbol='BTC',side='long',series={BTC:[],ETH:[]},lastSeen={BTC:0,ETH:0},ws=null,reconnectDelay=1000;for(const s of ['BTC','ETH'])series[s]=[];const fresh=s=>Date.now()-lastSeen[s]<12000&&lastSeen[s]>0;const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const pnl=p=>(state.prices[p.symbol]-p.entry)*p.qty*(p.side==='long'?1:-1);const notify=t=>{document.getElementById('toast').textContent=t};function switchSymbol(s){symbol=s;document.getElementById('btc').classList.toggle('active',s==='BTC');document.getElementById('eth').classList.toggle('active',s==='ETH');document.getElementById('quantityUnit').textContent=s;updateEstimate();render();loadKlines()}function setSide(s){side=s;document.getElementById('long').textContent='做多 LONG'+(s==='long'?' ✓':'');document.getElementById('short').textContent='做空 SHORT'+(s==='short'?' ✓':'')}function toggleOrderType(){let isLimit=document.getElementById('orderType').value==='limit',e=document.getElementById('orderPrice');e.disabled=!isLimit;e.placeholder=isLimit?'輸入限價或點選最新':'市價單使用下單時最新價';document.getElementById('latestBtn').disabled=!isLimit;updateEstimate()}function useLatestPrice(){if(document.getElementById('orderType').value!=='limit')return;if(!fresh(symbol)){notify('即時行情未連線，無法擷取最新價格');return}const price=state.prices[symbol];document.getElementById('orderPrice').value=String(price);updateEstimate();notify('已擷取 '+symbol+' 最新價 '+money(price)+' USDT；送出限價單後仍依觸價規則模擬成交')}
function updateEstimate(){let q=Number(document.getElementById('quantity').value),isLimit=document.getElementById('orderType').value==='limit',price=isLimit?Number(document.getElementById('orderPrice').value):(fresh(symbol)?state.prices[symbol]:0);document.getElementById('estimate').textContent='預估訂單價值：'+(q>0&&price>0?money(q*price)+' USDT':'— USDT')}
function validTriggers(side,entry,tp,sl){return side==='long'?tp>entry&&sl<entry:tp<entry&&sl>entry}
function createPosition(order,entry){let margin=order.qty*entry;if(margin>state.balance+1e-8){notify('可用虛擬餘額不足，無法成交');return false}if(!validTriggers(order.side,entry,order.tp,order.sl)){notify('成交價格已不符合止盈止損方向，模擬委託取消');return false}state.positions.push({id:Date.now()+Math.random(),symbol:order.symbol,side:order.side,entry,margin,lev:1,qty:order.qty,tp:order.tp,sl:order.sl,triggerPriceMode:true});state.balance-=margin;return true}
function openTrade(){if(!fresh(symbol)){notify('行情未連線或已過期，無法建立模擬交易');return}let qty=Number(document.getElementById('quantity').value),type=document.getElementById('orderType').value,limit=Number(document.getElementById('orderPrice').value),tp=Number(document.getElementById('tp').value),sl=Number(document.getElementById('sl').value),entry=type==='limit'?limit:state.prices[symbol];if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(entry)||entry<=0||!Number.isFinite(tp)||!Number.isFinite(sl)||tp<=0||sl<=0){notify('請填寫有效的幣種數量、訂單價格與止盈止損觸發價格');return}if(!validTriggers(side,entry,tp,sl)){notify(side==='long'?'做多：止盈必須高於訂單價，止損必須低於訂單價':'做空：止盈必須低於訂單價，止損必須高於訂單價');return}if(qty*entry>state.balance){notify('訂單價值超過可用虛擬餘額');return}let order={id:Date.now()+Math.random(),symbol,side,qty,limit,tp,sl,triggerPriceMode:true};if(type==='limit'&&!((side==='long'&&state.prices[symbol]<=limit)||(side==='short'&&state.prices[symbol]>=limit))){state.pending.push(order);notify('限價模擬委託已建立，等待行情觸價')}else{if(!createPosition(order,state.prices[symbol]))return;notify('模擬倉位已建立')}save();render()}
function cancelOrder(id){state.pending=state.pending.filter(o=>o.id!==id);save();render();notify('模擬委託已取消')}
function closeTrade(id,reason='手動平倉'){let i=state.positions.findIndex(x=>x.id===id);if(i<0)return;let p=state.positions[i];if(!fresh(p.symbol)){notify('行情未連線或已過期，暫停平倉');return}let profit=Math.max(-p.margin,pnl(p));state.balance+=p.margin+profit;state.realized+=profit;state.history.unshift({time:new Date().toLocaleString('zh-TW'),symbol:p.symbol,side:p.side,reason,profit});state.positions.splice(i,1);save();render()}function resetAccount(){if(!confirm('確定清空所有倉位、歷史紀錄，並將模擬本金重設為 100,000 USDT？'))return;state={balance:100000,realized:0,prices:{BTC:95000,ETH:3200},positions:[],history:[],pending:[]};for(const s of ['BTC','ETH'])series[s]=[];save();render()}let klineWs=null;let candleInterval='1h',candles={BTC:[],ETH:[]},klineToken=0;
function setIntervalK(v){candleInterval=v;loadKlines();connectKline()}
function updateTf(){document.querySelectorAll('#timeframes button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===candleInterval.toLowerCase()))}
async function loadKlines(){const token=++klineToken, sym=symbol, interval=candleInterval;updateTf();candles[sym]=[];draw();try{let r=await fetch('https://api.binance.com/api/v3/klines?symbol='+sym+'USDT&interval='+interval+'&limit=100',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let rows=await r.json();if(token!==klineToken)return;candles[sym]=rows.map(k=>({t:Number(k[0]),o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));draw()}catch(e){if(token===klineToken){notify('K 線歷史資料載入失敗；請確認網路或 Binance API 可用');draw()}}}
function connectKline(){if(klineWs){klineWs.onclose=null;klineWs.close()}const v=candleInterval;klineWs=new WebSocket('wss://stream.binance.com:443/stream?streams=btcusdt@kline_'+v+'/ethusdt@kline_'+v);klineWs.onmessage=e=>{try{let d=JSON.parse(e.data).data;if(d&&d.e==='kline')onKline(d)}catch(err){}};klineWs.onclose=()=>{if(v===candleInterval)setTimeout(connectKline,4000)}}
function onKline(data){let sym=data.s.slice(0,3),k=data.k;if(k.i!==candleInterval)return;let arr=candles[sym];if(!arr.length)return;let bar={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v},idx=arr.findIndex(x=>x.t===bar.t);if(idx>=0)arr[idx]=bar;else if(bar.t>arr[arr.length-1].t){arr.push(bar);if(arr.length>100)arr.shift()}if(sym===symbol)draw()}
function draw(){const canvas=document.getElementById('chart'),r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,3),w=r.width,h=r.height;canvas.width=Math.max(1,Math.round(w*d));canvas.height=Math.max(1,Math.round(h*d));let ctx=canvas.getContext('2d');ctx.scale(d,d);ctx.fillStyle='#151c30';ctx.fillRect(0,0,w,h);const arr=candles[symbol];if(!arr.length){ctx.fillStyle='#96a3bd';ctx.font='14px sans-serif';ctx.fillText('載入真實 K 線資料中…',12,35);return}const left=8,right=64,top=12,bottom=24,volHeight=46,priceH=h-top-bottom-volHeight-8,plotW=w-left-right;let lo=Math.min(...arr.map(x=>x.l)),hi=Math.max(...arr.map(x=>x.h)),pad=(hi-lo)*.07||hi*.0005;lo-=pad;hi+=pad;const y=p=>top+(hi-p)/(hi-lo)*priceH;ctx.strokeStyle='#2b344a';ctx.lineWidth=1;ctx.fillStyle='#9ca9c2';ctx.font='11px -apple-system,sans-serif';for(let i=0;i<=4;i++){let yy=top+i*priceH/4;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right+4,yy);ctx.stroke();ctx.fillText((hi-(hi-lo)*i/4).toFixed(symDecimals()),w-right+8,yy+4)}let step=plotW/arr.length,body=Math.max(2,Math.min(12,step*.65)),maxVol=Math.max(...arr.map(x=>x.v),1);arr.forEach((b,i)=>{let x=left+(i+.5)*step,up=b.c>=b.o,col=up?'#32d399':'#ff657a';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y(b.h));ctx.lineTo(x,y(b.l));ctx.stroke();let y1=y(Math.max(b.o,b.c)),y2=y(Math.min(b.o,b.c));ctx.fillRect(x-body/2,y1,body,Math.max(1,y2-y1));let vh=b.v/maxVol*(volHeight-5);ctx.globalAlpha=.55;ctx.fillRect(x-body/2,h-bottom-vh,body,vh);ctx.globalAlpha=1});let last=arr[arr.length-1];ctx.fillStyle=last.c>=last.o?'#32d399':'#ff657a';ctx.fillText('最新 '+last.c.toFixed(symDecimals()),left+4,top+13);for(let i=0;i<4;i++){let idx=Math.round((arr.length-1)*i/3),t=new Date(arr[idx].t);ctx.fillStyle='#9ca9c2';ctx.fillText((candleInterval==='1d'?(t.getMonth()+1)+'/'+t.getDate():String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')),left+idx*step,h-5)}}
function symDecimals(){return symbol==='BTC'?1:2}
function render(){let unreal=state.positions.reduce((a,p)=>a+Math.max(-p.margin,pnl(p)),0),locked=state.positions.reduce((a,p)=>a+p.margin,0);document.getElementById('equity').textContent=money(state.balance+locked+unreal);document.getElementById('balance').textContent=money(state.balance);document.getElementById('unreal').textContent=money(unreal);document.getElementById('unreal').className='big '+(unreal>=0?'green':'red');document.getElementById('realized').textContent=money(state.realized);document.getElementById('price').textContent=fresh(symbol)?money(state.prices[symbol]):'等待行情…';document.getElementById('feedStatus').textContent=fresh(symbol)?'● 即時行情':'○ 斷線／等待行情';document.getElementById('pending').innerHTML=state.pending.map(o=>`<tr><td>${o.symbol} ${o.side==='long'?'做多':'做空'}</td><td>${money(o.limit)}</td><td>${o.qty}</td><td><button data-cancel="${o.id}">取消</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">沒有待成交委託</td></tr>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelOrder(Number(b.dataset.cancel)));document.getElementById('positions').innerHTML=state.positions.map(p=>{let x=Math.max(-p.margin,pnl(p));return `<tr><td>${p.symbol} <span class="${p.side==='long'?'green':'red'}">${p.side==='long'?'做多':'做空'}</span></td><td>${money(p.entry)}</td><td>${p.qty}</td><td>${money(p.margin)}</td><td class="${x>=0?'green':'red'}">${money(x)}</td><td>${money(p.tp)} / ${money(p.sl)} USDT</td><td><button data-close="${p.id}">平倉</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">目前沒有持倉</td></tr>';document.getElementById('history').innerHTML=state.history.slice(0,100).map(h=>`<tr><td>${h.time}</td><td>${h.symbol}</td><td>${h.side==='long'?'做多':'做空'}</td><td>${h.reason}</td><td class="${h.profit>=0?'green':'red'}">${money(h.profit)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">尚無交易紀錄</td></tr>';document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeTrade(Number(b.dataset.close)));draw();updateEstimate()}function onPrice(sym,price){if(!Number.isFinite(price)||price<=0)return;state.prices[sym]=price;lastSeen[sym]=Date.now();series[sym].push(price);if(series[sym].length>100)series[sym].shift();for(const o of [...state.pending]){if(o.symbol!==sym)continue;if((o.side==='long'&&price<=o.limit)||(o.side==='short'&&price>=o.limit)){if(createPosition(o,price)){state.pending=state.pending.filter(x=>x.id!==o.id)}else{state.pending=state.pending.filter(x=>x.id!==o.id);notify('限價委託因餘額不足已取消')}}}for(const p of [...state.positions]){if(p.symbol!==sym)continue;const x=pnl(p);if((p.side==='long'&&price>=p.tp)||(p.side==='short'&&price<=p.tp))closeTrade(p.id,'止盈觸發');else if((p.side==='long'&&price<=p.sl)||(p.side==='short'&&price>=p.sl))closeTrade(p.id,'止損觸發');else if(x<=-p.margin)closeTrade(p.id,'模擬強制平倉')}save();render()}
function connect(){try{ws=new WebSocket('wss://stream.binance.com:443/stream?streams=btcusdt@trade/ethusdt@trade');ws.onopen=()=>{reconnectDelay=1000;render()};ws.onmessage=e=>{try{const data=JSON.parse(e.data).data;if(data&&data.e==='trade'&&(data.s==='BTCUSDT'||data.s==='ETHUSDT'))onPrice(data.s.slice(0,3),Number(data.p));if(data&&data.e==='kline')onKline(data)}catch(err){}};ws.onclose=()=>{ws=null;render();setTimeout(connect,reconnectDelay);reconnectDelay=Math.min(reconnectDelay*2,30000)};ws.onerror=()=>{if(ws)ws.close()}}catch(e){setTimeout(connect,5000)}}
window.addEventListener('resize',draw);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!ws||ws.readyState>1))connect()});toggleOrderType();render();connect();loadKlines();connectKline();setInterval(render,5000);
</script></body></html>
